# Postgres + MinIO for the Phase 2 backend. Not needed for Phase 0/1 (the
# PoC CLI runs against Arkiv or the mock ledger). One command: `pnpm dev:up`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: arctrace-postgres
    environment:
      POSTGRES_USER: arctrace
      POSTGRES_PASSWORD: arctrace
      POSTGRES_DB: arctrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arctrace"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Upstream minio/minio pulls are blocked by the registry mirror on some
    # machines; bitnamilegacy is the frozen official MinIO build (decision
    # D-0xx). Data dir differs from upstream, hence the command + volume path.
    image: bitnamilegacy/minio:latest
    container_name: arctrace-minio
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arctrace
      MINIO_ROOT_PASSWORD: arctrace123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  miniodata:
